<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ERAM — the sword route</title>
<meta name="description" content="The three sword-route levels from DELTARUNE Chapter 3's board game, rebuilt from the rooms themselves.">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#000; overflow:hidden; }
  body {
    font-family:'Courier New', Courier, monospace;
    font-weight:bold; color:#fff; text-transform:uppercase;
    -webkit-font-smoothing:none; cursor:default;
  }
  #board {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    image-rendering:pixelated; background:#000;
  }
  .label { position:fixed; top:14px; left:16px; font-size:12px; color:#2e2e2e; z-index:5; letter-spacing:.1em; }
  #hud { position:fixed; top:32px; left:16px; font-size:11px; color:#5a5a5a; z-index:5; letter-spacing:.1em; }
  #hud .on { color:#ffff00; }
  #levels {
    position:fixed; top:12px; right:16px; z-index:5;
    display:flex; gap:14px; font-size:12px; letter-spacing:.1em;
  }
  #levels button {
    background:none; border:none; color:#5a5a5a; font:inherit;
    text-transform:uppercase; cursor:pointer; padding:2px 4px;
  }
  #levels button.on { color:#ffff00; }
  #levels button:hover, #levels button:focus-visible { color:#fff; outline:none; }
  #levels .sep { color:#1c1c1c; }
  #failed {
    display:none; position:fixed; inset:0; z-index:60; background:#000;
    flex-direction:column; align-items:center; justify-content:center; gap:1.2rem;
    font-size:16px; line-height:1.9; text-align:center;
  }
</style>
</head>
<body>
<div class="label" id="label">ERAM · SWORD ROUTE</div>
<div id="hud"></div>
<div id="levels"></div>

<canvas id="board" width="640" height="480"
        aria-label="A board level. Arrow keys or WASD walk Kris; Z swings the sword; the screen shifts a whole pane at a time."></canvas>

<!-- The page keeps quiet: controls, approximation labels and credits live
     in the README (the user asked for a clean screen). -->
<div id="failed"><p>* THE LEVEL DID NOT LOAD.</p></div>

<script type="module">
  import { runBoard } from './sim/board.js';
  import { createAudio } from './sim/audio.js';

  const canvas = document.getElementById('board');
  function fit() {
    const f = Math.min(innerWidth / 640, innerHeight / 480);
    canvas.style.width = `${640 * f}px`;
    canvas.style.height = `${480 * f}px`;
  }
  addEventListener('resize', fit);
  fit();

  const index = await fetch('assets/levels/index.json').then((r) => r.json());
  const bar = document.getElementById('levels');
  const label = document.getElementById('label');
  const audio = createAudio('assets/');
  let running = null;
  const levelButtons = [];

  async function play(entry, btn) {
    if (running) running.stop();
    levelButtons.forEach((b) => b.classList.toggle('on', b === btn));
    label.textContent = `ERAM · ${entry.title}`;
    try {
      const level = await fetch(`assets/levels/${entry.file}`).then((r) => r.json());
      running = await runBoard(canvas, level, {
        base: 'assets/', audio,
        onComplete: (n) => {
          // The game leaves for the dungeons here; the sim offers the next
          // level instead.
          const next = index.find((e) => e.number === n + 1);
          setTimeout(() => { if (next) play(next, levelButtons[n]); }, 2000);
        },
      });
    } catch (err) {
      console.error('level failed to load:', err);
      document.getElementById('failed').style.display = 'flex';
    }
  }

  index.forEach((entry) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = `LEVEL ${entry.number}`;
    b.addEventListener('click', () => play(entry, b));
    bar.append(b);
    levelButtons.push(b);
  });

  const sep = document.createElement('span');
  sep.className = 'sep';
  sep.textContent = '·';
  bar.append(sep);

  const crtBtn = document.createElement('button');
  crtBtn.type = 'button';
  const paintCrt = () => {
    const on = window.__board ? window.__board.crt : true;
    crtBtn.textContent = on ? 'CRT ON' : 'CRT OFF';
    crtBtn.classList.toggle('on', on);
  };
  crtBtn.addEventListener('click', () => {
    if (window.__board) window.__board.crt = !window.__board.crt;
    paintCrt();
  });
  setTimeout(paintCrt, 2000);
  bar.append(crtBtn);

  const mute = document.createElement('button');
  mute.type = 'button';
  const paintMute = () => { mute.textContent = audio.muted ? 'SOUND OFF' : 'SOUND ON'; mute.classList.toggle('on', !audio.muted); };
  mute.addEventListener('click', () => { audio.muted = !audio.muted; paintMute(); });
  paintMute();
  bar.append(mute);

  // A readout of the run.
  const hud = document.getElementById('hud');
  setInterval(() => {
    const b = window.__board;
    if (!b) return;
    hud.innerHTML = b.sword
      ? `<span class="on">SWORD LV ${b.swordlv}</span> &middot; XP ${b.xp} &middot; HP ${b.health}/12`
      : `NO SWORD &middot; HP ${b.health}/12`;
  }, 100);

  if (index.length) play(index[0], levelButtons[0]);
</script>
</body>
</html>
